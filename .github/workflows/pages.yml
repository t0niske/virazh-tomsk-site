# Предпросмотр на GitHub Pages: сборка с префиксом /virazh-tomsk-site, закрыт от индексации.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка
        run: perl tools/build.pl --preview --base=/virazh-tomsk-site --out=_preview
      - name: Проверка продакшен-сборки
        run: perl tools/build.pl --out=_site && perl tools/check.pl _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
