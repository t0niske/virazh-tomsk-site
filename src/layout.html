<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{robots}}<meta property="og:type" content="website">
<meta property="og:site_name" content="Автошкола «Авто-Вираж»">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="https://virazh-tomsk.ru/img/hero-bg.webp">
<meta property="og:locale" content="ru_RU">
<script>/* версия для слабовидящих: применяем настройки до отрисовки */try{var a=JSON.parse(localStorage.getItem('a11y')||'null');if(a&&a.on){var c=document.documentElement.classList;c.add('a11y','a11y-fs-'+a.fs,'a11y-sch-'+a.sch);if(a.img==='off')c.add('a11y-noimg');if(a.sp==2)c.add('a11y-sp')}}catch(e){}</script>
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="stylesheet" href="/assets/css/fonts.css?v={{version}}">
<link rel="stylesheet" href="/assets/css/site.css?v={{version}}">
<link rel="stylesheet" href="/assets/css/pages.css?v={{version}}">
{{head}}
</head>
<body class="{{body_class}}">
{{header}}
<main id="top">
{{content}}
</main>
{{footer}}
{{overlays}}
<script src="/assets/js/site.js?v={{version}}" defer></script>
<script src="/assets/js/bot.js?v={{version}}" defer></script>
</body>
</html>
